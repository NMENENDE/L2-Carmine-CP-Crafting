name: Index original item icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import_item_icons.py'
      - '.github/workflows/icons.yml'
  schedule:
    - cron: '10 9 1 * *'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original-icon manifest
        run: python scripts/import_item_icons.py
      - name: Commit index if updated
        run: |
          git config user.name "carmine-icon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icons.json data/icons-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "data: sync indexed original Lineage II icons"
            git push
          fi

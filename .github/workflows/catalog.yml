name: Import LU4 catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 1 * *'
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Index factual catalogue
        run: python scripts/catalog_import.py
      - name: Commit indexed data
        run: |
          git config user.name "carmine-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh LU4 factual catalog"
            git push
          fi
